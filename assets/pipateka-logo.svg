  <text x="450" y="284" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="102" font-weight="700" letter-spacing="4" fill="#f6e7bf">PIPATEKA</text>
  <text x="450" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="7" fill="#d9ad62">TABACO · PIPAS · ACCESORIOS</text>
