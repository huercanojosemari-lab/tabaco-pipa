    <path d="M483 154 C490 165 503 175 514 177 L528 166 L500 146 Z" fill="#d6a052" opacity=".95"/>
    <ellipse cx="356" cy="102" rx="55" ry="17" fill="#100c09" stroke="#e1b66d" stroke-width="4"/>
