<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Pipateka</title>
  <desc id="desc">Logotipo de Pipateka con una pipa clásica, humo y el nombre de la enciclopedia.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#352116"/>
      <stop offset="0.58" stop-color="#18100c"/>
      <stop offset="1" stop-color="#070605"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#9d682f"/>
      <stop offset="0.5" stop-color="#f0d58a"/>
      <stop offset="1" stop-color="#b27b36"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a130b"/>
      <stop offset="0.45" stop-color="#b76a35"/>
      <stop offset="0.75" stop-color="#5f301c"/>
      <stop offset="1" stop-color="#1a0e09"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".72"/>
    </filter>
  </defs>

  <rect width="900" height="460" rx="18" fill="url(#bg)"/>
