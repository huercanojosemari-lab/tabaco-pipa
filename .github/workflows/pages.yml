name: Deploy Pipateka to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install catalogue image dependency
        run: python -m pip install --disable-pip-version-check --no-input Pillow
      - name: Build expanded blend catalogue
        run: python scripts/build-catalog.py
      - name: Import complete catalogues for known major brands
        run: python scripts/import-known-brands.py
      - name: Enrich technical data from TobaccoReviews detail pages
        run: python scripts/enrich-catalog.py
      - name: Generate local brand images for every loaded brand
        run: python scripts/build-brand-images.py
      - name: Enrich Mac Baren images from official media library
        run: python scripts/enrich-mac-baren-images.py
      - name: Build Mac Baren editorial catalogue
        run: python scripts/build-mac-baren.py
      - name: Build brands from loaded catalogue
        run: python scripts/build-brands.py
      - name: Sync frontend catalogue from generated index
        run: python scripts/sync-frontend-data.py
      - name: Validate generated catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('data/catalogo-global.json').read_text(encoding='utf-8'))
          brands = json.loads(Path('data/marcas.json').read_text(encoding='utf-8'))
          mac = json.loads(Path('data/mac-baren.json').read_text(encoding='utf-8'))
          blends = catalog.get('blends', [])
          loaded_brands = brands.get('marcas', [])
          mac_rows = mac.get('blends', [])
          if not blends: raise SystemExit('ERROR: el catálogo generado está vacío')
          if not loaded_brands: raise SystemExit('ERROR: no se han generado marcas')
          if mac.get('marca') != 'Mac Baren' or len(mac_rows) < 100: raise SystemExit('ERROR: Mac Baren incompleto')
          if len(loaded_brands) < 100: raise SystemExit(f'ERROR: índice de marcas incompleto: {len(loaded_brands)}')
          if len(blends) < 1000: raise SystemExit(f'ERROR: catálogo global inesperadamente pequeño: {len(blends)}')
          if any(not b.get('marca') or not b.get('nombre') for b in blends): raise SystemExit('ERROR: hay fichas sin marca o nombre')
          required_known = {'Mac Baren':100,'Peterson':60,'Samuel Gawith':80,'Cornell & Diehl':250,'Gawith, Hoggarth & Co.':150,'Dan Tobacco':80,'Sutliff Tobacco Company':250,"Rattray's":30,'Dunhill':40,'Esoterica Tobacciana':15,'McClelland':150,'Seattle Pipe Club':25,'Wessex':20,'A&C Petersen':10}
          known_sources = catalog.get('known_brand_sources', {})
          missing_known=[f'{b} ({known_sources.get(b,0)})' for b,m in required_known.items() if int(known_sources.get(b,0) or 0)<m]
          if missing_known: raise SystemExit('ERROR: faltan fichas de marcas principales: '+', '.join(missing_known))
          pairs = {(str(b.get('marca','')).casefold(), str(b.get('nombre','')).casefold()) for b in blends}
          if len(pairs) != len(blends): raise SystemExit('ERROR: hay mezclas duplicadas marca/nombre')
          incomplete = [b.get('nombre') for b in mac_rows if not b.get('descripcion') or not b.get('reseña_pipateka')]
          if incomplete: raise SystemExit(f'ERROR: fichas Mac Baren incompletas: {len(incomplete)}')
          print(f'OK: {len(blends)} mezclas, {len(loaded_brands)} marcas, {catalog.get("blends_con_imagen", 0)} imágenes globales')
          print(f'OK: Mac Baren {len(mac_rows)} fichas, {sum(1 for b in mac_rows if b.get("imagen"))} imágenes locales')
          PY
      - name: Validate frontend assets and JavaScript
        run: |
          set -euo pipefail
          for file in index.html catalogo.html marcas.html marca.html tipos.html pipateka.css pipateka-data.js pipateka.js marca.js assets/pipateka-logo.svg assets/tins/editorial-tin.svg; do
            test -f "$file" || { echo "ERROR: falta $file"; exit 1; }
          done
          node --check pipateka-data.js
          node --check pipateka.js
          node --check marca.js
          test -d assets/brands || { echo "ERROR: falta assets/brands"; exit 1; }
          grep -q 'id="featuredGrid"' index.html
          grep -q 'id="detailModal"' index.html
          grep -q 'id="catalogGrid"' catalogo.html
          grep -q 'id="detailModal"' catalogo.html
          grep -q 'pipateka-data.js' marca.html
          grep -q "typeof BBDD_TABACOS" marca.js
          grep -q "isEditorialItem(item)" pipateka.js
          python - <<'PY'
          import re
          from pathlib import Path
          data = Path('pipateka-data.js').read_text(encoding='utf-8')
          required = ['id','nombre','marca','tipo','corte','fuerza','aroma','composicion','valoracion','popularidad','disponibilidad','imagen','reseñas']
          objects = re.findall(r'\{\s*[\"\']id[\"\']\s*:', data)
          if len(objects) < 1000:
              raise SystemExit(f'ERROR: BBDD_TABACOS no contiene el catálogo ampliado: {len(objects)} fichas')
          for field in required:
              if field not in data:
                  raise SystemExit(f'ERROR: falta el campo requerido {field} en BBDD_TABACOS')
          if data.count('"reseñas"') < 1000:
              raise SystemExit('ERROR: faltan arrays de reseñas en BBDD_TABACOS')
          if data.count('"imagen_marca"') < 1000:
              raise SystemExit('ERROR: faltan imágenes de marca en BBDD_TABACOS')
          html = Path('index.html').read_text(encoding='utf-8')
          if '8.500+' in html or '8500+' in html:
              raise SystemExit('ERROR: métrica obsoleta 8.500+ detectada; debe distinguir referencia externa de datos locales')
          brand_files = list(Path('assets/brands').glob('*.svg'))
          if len(brand_files) < 100: raise SystemExit(f'ERROR: biblioteca de marcas incompleta: {len(brand_files)} SVG')
          print(f'OK: BBDD_TABACOS validada con {len(objects)} fichas y {len(brand_files)} imágenes de marca.')
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('data/catalogo-global.json').read_text(encoding='utf-8'))
          blends=catalog.get('blends',[])
          missing=[b.get('nombre') for b in blends if not b.get('imagen_marca') or not Path(b['imagen_marca']).exists()]
          if missing: raise SystemExit(f'ERROR: faltan imágenes de marca en {len(missing)} fichas')
          incomplete=[b.get('nombre') for b in blends if not b.get('nombre') or not b.get('marca') or not b.get('tipo') or not b.get('corte') or not b.get('composicion') or not b.get('fuerza_label') or not b.get('aromatizacion') or not b.get('nota_estancia') or not b.get('sabor') or not b.get('pais') or not b.get('produccion') or not b.get('packaging') or not b.get('descripcion')]
          if incomplete: raise SystemExit(f'ERROR: hay {len(incomplete)} fichas con campos básicos incompletos')
          print(f'OK: {len(blends)} fichas con datos básicos e imagen de marca.')
          print(f'OK: {catalog.get("brand_image_count",0)} imágenes de marca generadas.')
          PY
          echo "OK: frontend editorial, assets y JavaScript validados."
      - name: Persist generated catalogue and image library
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tins assets/brands data/catalogo-global.json data/mac-baren.json data/marcas.json data/tobaccoreviews-enrichment.json data/brand-images.json pipateka-data.js
          if git diff --cached --quiet; then
            echo "No hay cambios generados que guardar."
            exit 0
          fi
          git commit -m "Actualizar catálogo, marcas y biblioteca visual [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase conflictivo; abortando para evitar publicar un estado mezclado."
              git rebase --abort
              exit 1
            }
            if git push origin HEAD:main; then
              echo "Persistencia completada en el intento $attempt."
              exit 0
            fi
            echo "Push rechazado; se reintentará con el remoto actualizado ($attempt/5)."
            sleep 2
          done
          echo "ERROR: no se pudo sincronizar main después de 5 intentos."
          exit 1
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Validación de pre-lanzamiento legal
        run: |
          set -euo pipefail
          test -f aviso-legal.html
          test -f privacidad.html
          test -f cookies.html
          test -f metodologia.html
          if grep -RniE '\\[PENDIENTE|TU_NOMBRE|TU_EMAIL|TU_DIRECCION|TU_NIF' aviso-legal.html privacidad.html cookies.html metodologia.html; then
            echo "ERROR: faltan datos identificativos del responsable en la documentación legal."
            exit 1
          fi
          grep -qi 'no vende tabaco' index.html
          grep -qi 'no vende tabaco' aviso-legal.html
          grep -qi 'no vende tabaco' metodologia.html
          grep -qi 'consentimiento' privacidad.html
          grep -qi 'cookies' cookies.html
          if grep -RniE 'comprar|compra|oferta|descuento|precio|tienda|venta' index.html newsletter.html secciones.js | grep -vE 'no vende|no facilita|no constituye|venta de tabaco'; then
            echo "ERROR: posible lenguaje comercial/promocional detectado en superficies editoriales."
            exit 1
          fi
          echo "OK: documentación de pre-lanzamiento presente. La identidad del responsable debe estar completada para permitir el despliegue."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
